# Classifies a pull request from the files it changes and posts a summary
# comment. The categories are:
#
#   * Code          - adds or changes Lua code, regardless of other content
#   * Helper script - changes code that is not Lua code
#   * Documentation - only updates documentation
#   * Locale        - only updates locale strings, no code changes
#
# Uses pull_request_target so the token can comment on pull requests opened
# from forks. No pull request code is checked out or executed; the file list is
# read from the GitHub API and the workflow always runs from the base branch.

name: PR Type

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    steps:
      - name: Summarize PR type
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-type-summary -->';
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const isLua = (name) => /\.lua$/i.test(name);
            const isLocale = (name) => name === 'locale' || name.startsWith('locale/');
            const isDocs = (name) =>
              /\.(md|mdx)$/i.test(name) ||
              name === 'changelog.txt' ||
              name.startsWith('docs/') ||
              name.startsWith('docs-source/') ||
              name.startsWith('README_images/');

            const names = files.map((file) => file.filename);
            const lua = names.filter(isLua);
            const locale = names.filter((name) => !isLua(name) && isLocale(name));
            const docs = names.filter(
              (name) => !isLua(name) && !isLocale(name) && isDocs(name),
            );
            // Anything that is not Lua, locale or documentation is treated as a
            // helper script (code that is not Lua code).
            const other = names.filter(
              (name) => !isLua(name) && !isLocale(name) && !isDocs(name),
            );

            let type;
            let explanation;
            if (names.length === 0) {
              type = 'Unknown';
              explanation = 'No changed files were reported for this pull request.';
            } else if (lua.length > 0) {
              type = 'Code';
              explanation = 'This pull request adds or changes Lua code. Any Lua change puts the pull request in this category, regardless of other content.';
            } else if (other.length > 0) {
              type = 'Helper script';
              explanation = 'This pull request changes code that is not Lua code.';
            } else if (docs.length > 0) {
              type = 'Documentation';
              explanation = 'This pull request only updates documentation.';
            } else {
              type = 'Locale';
              explanation = 'This pull request only updates locale strings and does not change any code.';
            }

            const lines = [
              marker,
              `## PR type: **${type}**`,
              '',
              explanation,
              '',
              '| Category | Changed files |',
              '| --- | --- |',
              `| Lua code | ${lua.length} |`,
              `| Helper script | ${other.length} |`,
              `| Documentation | ${docs.length} |`,
              `| Locale | ${locale.length} |`,
            ];

            const addList = (label, items) => {
              if (items.length === 0) {
                return;
              }
              lines.push('', `<details><summary>${label} (${items.length})</summary>`, '');
              lines.push(...items.slice(0, 50).map((name) => `- \`${name}\``));
              if (items.length > 50) {
                lines.push(`- ...and ${items.length - 50} more`);
              }
              lines.push('', '</details>');
            };

            addList('Lua code files', lua);
            addList('Helper script files', other);
            addList('Documentation files', docs);
            addList('Locale files', locale);

            lines.push('', '<sub>Generated by the PR Type workflow.</sub>');

            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            }

            await core.summary.addRaw(body).write();
