# SPDX-License-Identifier: LGPL-3.0-or-later WITH FUnit-CI-Exception
#
# Headless FUnit test suite for PlanetsLib, based on the GitHub Actions
# template from https://gitlab.com/jfletcher94/funit.
#
# The suite itself lives in test-mods/planetslib-funit-data. This workflow
# builds the mod archives and four scenarios, runs them in a Factorio job
# container, writes a failure summary to the run page, then converts FUnit's
# JSON reports to JUnit XML. Failing runs on same-repository pull requests also
# post the summary as a PR comment; a later passing run deletes those comments.
#
# Scenarios:
#   * base (no Space Age/Quality/Elevated Rails), entity replacements on/off
#   * Space Age + Quality + Elevated Rails, entity replacements on/off
#
# The no-replacements scenarios load the test-only planetslib-funit-settings
# mod, which forces PlanetsLib-enable-entity-replacements to false.
#
# See .github/funit/README.md for the local adaptations to the template.

name: FUnit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  FACTORIO_VERSION: "2.1.22"
  MOD_NAME: PlanetsLib
  TEST_MOD_NAME: planetslib-funit-data
  TEST_MOD_DIR: test-mods/planetslib-funit-data
  FUNIT_COMMIT: b69c2f277a467726e3a8c555d48df5b647ec5a64
  FUNIT_SCRIPTS_URL: https://gitlab.com/jfletcher94/funit/-/raw/master/scripts
  TIMEOUT: 5m
  USERNAME: ${{ secrets.FACTORIO_USERNAME }}
  TOKEN: ${{ secrets.FACTORIO_TOKEN }}

jobs:
  build-archive-job:
    name: Build test artifacts
    runs-on: ubuntu-latest
    container:
      image: ruby:4-alpine
    timeout-minutes: 30
    outputs:
      factorio_version: ${{ env.FACTORIO_VERSION }}
    defaults:
      run:
        shell: sh
    steps:
      - run: apk add --no-cache bash ca-certificates git jq wget zip
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Build archives, scenarios and test config
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          mod_version="$(jq -r '.version' info.json)"
          mod_folder="${MOD_NAME}_${mod_version}"
          mod_archive="${mod_folder}.zip"
          test_version="$(jq -r '.version' "$TEST_MOD_DIR/info.json")"
          test_folder="${TEST_MOD_NAME}_${test_version}"
          test_archive="${test_folder}.zip"
          settings_version="$(jq -r '.version' test-mods/planetslib-funit-settings/info.json)"
          settings_folder="planetslib-funit-settings_${settings_version}"
          settings_archive="${settings_folder}.zip"

          mkdir -p "artifacts/${MOD_NAME}/scenarios" "artifacts/${MOD_NAME}/test" build

          # The repository root is the mod. .gitattributes excludes test-mods/,
          # .github/, docs/ and other development-only files from this archive.
          git archive --worktree-attributes --format=zip HEAD \
            -o "artifacts/${MOD_NAME}/${mod_archive}" \
            --prefix="${mod_folder}/"

          git archive --worktree-attributes --format=zip "HEAD:${TEST_MOD_DIR}" \
            -o "artifacts/${MOD_NAME}/${test_archive}" \
            --prefix="${test_folder}/"

          git archive --worktree-attributes --format=zip HEAD:test-mods/planetslib-funit-settings \
            -o "artifacts/${MOD_NAME}/${settings_archive}" \
            --prefix="${settings_folder}/"

          # FUnit is public, so package it locally instead of requiring mod
          # portal credentials just to download the test framework. Pin the
          # commit so the packaged mod matches the copied CI helpers.
          git clone --depth 1 https://gitlab.com/jfletcher94/funit.git funit-src
          git -C funit-src fetch --depth 1 origin "$FUNIT_COMMIT"
          git -C funit-src checkout --detach "$FUNIT_COMMIT"
          funit_version="$(jq -r '.version' funit-src/funit/info.json)"
          test -n "$funit_version"
          (cd funit-src && zip -qr "../artifacts/${MOD_NAME}/funit_${funit_version}.zip" funit)

          cp -a "$TEST_MOD_DIR/test/." "artifacts/${MOD_NAME}/test/"
          : > "artifacts/${MOD_NAME}/save_names.txt"
          : > "artifacts/${MOD_NAME}/scenario_names.txt"

          # Use the upstream dependency expander rather than maintaining a
          # static dependency graph. Its local-mod detection reads these
          # directories instead of querying the mod portal.
          wget -qO build/expand_dependencies.rb \
            "${FUNIT_SCRIPTS_URL}/expand_dependencies.rb"
          expand_dir="$GITHUB_WORKSPACE/build/expand"
          mkdir -p "$expand_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$expand_dir/PlanetsLib"
          ln -sfn "$GITHUB_WORKSPACE/funit-src/funit" "$expand_dir/funit"
          ln -sfn "$GITHUB_WORKSPACE/$TEST_MOD_DIR" "$expand_dir/$TEST_MOD_NAME"
          ln -sfn "$GITHUB_WORKSPACE/test-mods/planetslib-funit-settings" \
            "$expand_dir/planetslib-funit-settings"

          write_scenario() {
            local name="$1"
            local replacements="$2"
            local dlc="$3"
            local dest="artifacts/${MOD_NAME}/scenarios/${name}"

            cp -a "$TEST_MOD_DIR/tests/scenario" "$dest"
            jq -n \
              --arg replacements "$replacements" \
              --arg dlc "$dlc" \
              '{
                mods: (
                  [
                    {name: "base", enabled: true},
                    {name: "funit", enabled: true},
                    {name: "PlanetsLib", enabled: true},
                    {name: "planetslib-funit-data", enabled: true}
                  ]
                  + (if $dlc == "true" then [
                      {name: "space-age", enabled: true},
                      {name: "quality", enabled: true},
                      {name: "elevated-rails", enabled: true}
                    ] else [
                      {name: "space-age", enabled: false},
                      {name: "quality", enabled: false},
                      {name: "elevated-rails", enabled: false}
                    ] end)
                  + [{name: "recycler", enabled: true}]
                  + (if $replacements == "false" then [
                      {name: "planetslib-funit-settings", enabled: true}
                    ] else [
                      {name: "planetslib-funit-settings", enabled: false}
                    ] end)
                )
              }' > "$dest/mod-list.json"

            (cd "$expand_dir" && ruby "$GITHUB_WORKSPACE/build/expand_dependencies.rb" \
              -i "$TEST_MOD_NAME/info.json" \
              -m "$GITHUB_WORKSPACE/$dest/mod-list.json" \
              -o "$GITHUB_WORKSPACE/$dest/mod-list.json")

            echo "$name" >> "artifacts/${MOD_NAME}/scenario_names.txt"
          }

          write_scenario "__funit__planetslib_base" "true" "false"
          write_scenario "__funit__planetslib_base_no_replacements" "false" "false"
          write_scenario "__funit__planetslib_space_age" "true" "true"
          write_scenario "__funit__planetslib_space_age_no_replacements" "false" "true"

          echo "Built artifacts:"
          find "artifacts/${MOD_NAME}" -maxdepth 2 -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: build-archive-job
          retention-days: 1
          path: artifacts/
          if-no-files-found: error

  unit-test-job:
    name: Run FUnit scenarios
    needs: build-archive-job
    runs-on: ubuntu-latest
    container:
      image: "factoriotools/factorio:${{ needs.build-archive-job.outputs.factorio_version }}"
    timeout-minutes: 30
    env:
      UPDATE_MODS_ON_START: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/download-artifact@v4
        with:
          name: build-archive-job
          path: artifacts
      - name: Prepare test environment
        run: bash .github/funit/prepare_test_environment.sh
      - name: Run FUnit scenarios
        run: |
          mkdir -p "test_artifacts/${MOD_NAME}"
          (cd / && bash "$GITHUB_WORKSPACE/.github/funit/entrypoint.sh") \
            2>&1 | tee "$GITHUB_WORKSPACE/test_artifacts/${MOD_NAME}/funit.log"
      - name: Collect JSON reports
        if: always()
        run: |
          mkdir -p "test_artifacts/${MOD_NAME}/reports"
          if [ -d /factorio/script-output ]; then
            cp -a /factorio/script-output/. "test_artifacts/${MOD_NAME}/reports/"
          fi
      - name: Verify every scenario produced a report
        if: always()
        run: |
          reports=(
            planetslib-base
            planetslib-base-no-replacements
            planetslib-space-age
            planetslib-space-age-no-replacements
          )
          missing=0
          for report in "${reports[@]}"; do
            path="test_artifacts/${MOD_NAME}/reports/funit-report-${report}.json"
            if [ ! -s "$path" ]; then
              echo "::error::Missing FUnit report: ${path}"
              missing=1
            else
              echo "Found ${path}"
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-job
          retention-days: 30
          path: test_artifacts

  parse-results-job:
    name: Parse and summarize FUnit results
    needs: unit-test-job
    if: ${{ !cancelled() && needs.unit-test-job.result != 'skipped' }}
    runs-on: ubuntu-latest
    # Needed to post (and later delete) the failure summary on pull requests.
    permissions:
      contents: read
      pull-requests: write
    container:
      image: ruby:4-alpine
    timeout-minutes: 30
    steps:
      - run: apk add --no-cache ca-certificates git wget
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-job
          path: test_artifacts
      # Write a human-readable summary to the run page even when a scenario
      # crashed and produced no report. The step itself never fails the job;
      # the JUnit conversion below is what reports the test result.
      - name: Summarize FUnit results
        id: summarize
        if: always()
        run: |
          ruby .github/funit/summarize_funit_results.rb \
            "test_artifacts/${MOD_NAME}/reports" \
            --expect "planetslib-base,planetslib-base-no-replacements,planetslib-space-age,planetslib-space-age-no-replacements" \
            --min-tests "planetslib-base=128,planetslib-base-no-replacements=128,planetslib-space-age=155,planetslib-space-age-no-replacements=155" \
            --log "test_artifacts/${MOD_NAME}/funit.log" \
            --comment "funit-summary.md" \
            --github-output "$GITHUB_OUTPUT"
      - name: Fetch FUnit JSON parser
        run: |
          wget -qO parse_funit_json.rb \
            "${FUNIT_SCRIPTS_URL}/parse_funit_json.rb"
      - name: Convert FUnit reports to JUnit XML
        run: |
          ruby parse_funit_json.rb \
            "test_artifacts/${MOD_NAME}/reports" \
            -o "funit-report-${MOD_NAME}.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parse-results-job
          retention-days: 30
          path: funit-report-*.xml
      # Pull request feedback. Fork PRs are skipped because their GITHUB_TOKEN
      # is read-only, so comment creation and deletion would fail. Each failing
      # run posts a new comment; any later passing run removes them all.
      - name: Comment FUnit failures on pull request
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.summarize.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- funit-results -->';
            const summary = fs.readFileSync('funit-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}\n${summary}`
            });
      - name: Remove stale FUnit comments after a passing run
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.summarize.outputs.failed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- funit-results -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            for (const comment of comments) {
              const isOurComment =
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker);
              if (isOurComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id
                });
              }
            }
