# Headless FUnit test suite for PlanetsLib.
#
# Runs the scenario in test-mods/planetslib-funit-data/tests/scenario inside a
# factorio-docker container and fails the job if any FUnit test failed or errored.
#
# The suite contents were validated locally against Factorio 2.1.22 on both
# entity-replacements axes (142 tests, 0 failures/errors). The container
# invocation below has not been run locally because no Docker daemon was
# available; the factorio-docker image tag, container paths and startup
# invocation may still need adjustment. The paths used here
# (/factorio/{mods,config,scenarios,script-output}) match the layout documented
# by factoriotools/factorio-docker.
#
# Matrix:
#   * mods:               base only  vs  base + space-age + quality
#   * entity_replacements: PlanetsLib-enable-entity-replacements true vs false

name: FUnit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  funit:
    name: "FUnit (${{ matrix.mods.label }}, entity-replacements=${{ matrix.entity_replacements }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mods:
          - label: base
            space_age: "false"
          - label: base-space-age-quality
            space_age: "true"
        entity_replacements: ["true", "false"]

    env:
      # Pin this to a specific tag (e.g. factoriotools/factorio:2.1.20) for
      # reproducible runs once a known-good tag is confirmed.
      FACTORIO_IMAGE: factoriotools/factorio:stable
      GAME_HOME: ${{ github.workspace }}/factorio
      MODS_DIR: ${{ github.workspace }}/factorio/mods
      SCENARIO_DIR: ${{ github.workspace }}/factorio/scenarios
      REPORTS_DIR: ${{ github.workspace }}/factorio/script-output

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Assemble mods and scenario directories
        run: |
          set -euo pipefail
          mkdir -p "$MODS_DIR" "$SCENARIO_DIR" "$REPORTS_DIR" "$GAME_HOME/config"

          # PlanetsLib: the repository root is the mod.
          cp -r repo "$MODS_DIR/PlanetsLib"

          # Development-only data-fixture companion mod.
          cp -r repo/test-mods/planetslib-funit-data "$MODS_DIR/planetslib-funit-data"

          # FUnit (open source, GitLab); the mod lives in the `funit/` subfolder.
          git clone --depth 1 https://gitlab.com/jfletcher94/funit.git funit-src
          cp -r funit-src/funit "$MODS_DIR/funit"

          # The test scenario is a thin launcher kept inside the companion mod;
          # Factorio still loads it from the top-level scenarios directory.
          cp -r repo/test-mods/planetslib-funit-data/tests/scenario "$SCENARIO_DIR/funit"

          # The container runs as a different uid than the runner; make the
          # bind-mounted dirs writable (needed for script-output/reports).
          chmod -R 777 "$GAME_HOME"

      # Space Age / Quality are paid mods and cannot be bundled. If the
      # FACTORIO_USERNAME / FACTORIO_TOKEN secrets are set, download them from
      # the mod portal; otherwise this matrix leg effectively runs base-only.
      - name: Download Space Age and Quality (optional)
        if: matrix.mods.space_age == 'true'
        env:
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FACTORIO_TOKEN:-}" ] || [ -z "${FACTORIO_USERNAME:-}" ]; then
            echo "::warning::FACTORIO_USERNAME/FACTORIO_TOKEN secrets not set; skipping Space Age / Quality download. This matrix leg will run base-only."
            exit 0
          fi
          for mod in space-age quality; do
            # download_url has no file extension (e.g. /download/quality/<id>);
            # the release's file_name is the name Factorio expects on disk.
            read -r download_url file_name < <(
              curl -fsSL "https://mods.factorio.com/api/mods/${mod}/full" \
                | python3 -c 'import json,sys; r=json.load(sys.stdin)["releases"][0]; print(r["download_url"], r["file_name"])'
            )
            curl -fsSL -o "$MODS_DIR/$file_name" \
              "https://mods.factorio.com${download_url}?username=${FACTORIO_USERNAME}&token=${FACTORIO_TOKEN}"
          done

      - name: Write mod-list.json
        run: |
          set -euo pipefail
          python3 - "$SCENARIO_DIR/funit/mod-list.json" "$MODS_DIR/mod-list.json" "$MODS_DIR" "${{ matrix.mods.space_age }}" <<'PY'
          import glob, json, os, sys

          scenario_list, mods_list, mods_dir, want_space_age = sys.argv[1:5]

          def have(name):
              return bool(glob.glob(os.path.join(mods_dir, name + "_*.zip")))

          mods = [
              {"name": "base", "enabled": True},
              {"name": "funit", "enabled": True},
              {"name": "PlanetsLib", "enabled": True},
              {"name": "planetslib-funit-data", "enabled": True},
          ]
          if want_space_age == "true" and have("space-age") and have("quality"):
              mods.append({"name": "space-age", "enabled": True})
              mods.append({"name": "quality", "enabled": True})

          for path in (scenario_list, mods_list):
              with open(path, "w") as f:
                  json.dump({"mods": mods}, f, indent=2)
          print("mod-list.json:", [m["name"] for m in mods])
          PY

      - name: Write Factorio config
        run: |
          set -euo pipefail
          cat > "$GAME_HOME/config/config.ini" <<'EOF'
          [path]
          write-data=/factorio
          EOF
          cat > "$GAME_HOME/config/server-settings.json" <<'EOF'
          {
            "name": "PlanetsLib FUnit",
            "description": "Headless FUnit run",
            "visibility": { "public": false, "lan": false },
            "max_players": 1,
            "auto_pause": false,
            "auto_pause_when_players_connect": false
          }
          EOF

      # Startup settings are stored in the binary mod-settings.dat, which is
      # awkward to author headlessly. For the "entity replacements disabled"
      # matrix leg we instead generate a tiny mod whose settings-updates.lua
      # forces PlanetsLib-enable-entity-replacements to false. (A pre-generated
      # mod-settings.dat dropped into $MODS_DIR would work just as well.)
      - name: Apply startup settings override
        if: matrix.entity_replacements == 'false'
        run: |
          set -euo pipefail
          override="$MODS_DIR/planetslib-funit-settings"
          mkdir -p "$override"
          cat > "$override/info.json" <<'EOF'
          { "name": "planetslib-funit-settings", "version": "0.0.1", "factorio_version": "2.1", "title": "PlanetsLib FUnit Settings", "author": "test", "dependencies": ["base", "PlanetsLib"] }
          EOF
          cat > "$override/settings-updates.lua" <<'EOF'
          local setting = data.raw["bool-setting"]["PlanetsLib-enable-entity-replacements"]
          setting.hidden = true
          setting.forced_value = false
          EOF
          python3 - "$MODS_DIR/mod-list.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["mods"].append({"name": "planetslib-funit-settings", "enabled": True})
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Run FUnit scenario
        run: |
          set -euo pipefail
          docker pull "$FACTORIO_IMAGE"
          log="$GITHUB_WORKSPACE/funit.log"

          # NOTE: the game does not exit when the tests finish, so run it in the
          # background and stop it once FUnit prints its end marker. Adjust the
          # invocation below if the image tag/paths differ.
          docker run --rm --name funit-run \
            -v "$MODS_DIR":/factorio/mods \
            -v "$SCENARIO_DIR":/factorio/scenarios \
            -v "$REPORTS_DIR":/factorio/script-output \
            -v "$GAME_HOME/config/config.ini":/factorio/config/config.ini \
            -v "$GAME_HOME/config/server-settings.json":/factorio/config/server-settings.json \
            --entrypoint /opt/factorio/bin/x64/factorio \
            "$FACTORIO_IMAGE" \
            --start-server-load-scenario funit \
            --mod-directory /factorio/mods \
            --config /factorio/config/config.ini \
            --server-settings /factorio/config/server-settings.json \
            > "$log" 2>&1 &
          run_pid=$!

          for _ in $(seq 1 90); do
            if grep -q '====END====' "$log"; then break; fi
            sleep 5
          done
          docker stop funit-run >/dev/null 2>&1 || true
          wait "$run_pid" || true

          grep -q '====END====' "$log" || {
            echo "::error::FUnit never reported ====END====; see the log artifact."
            tail -n 200 "$log"
            exit 1
          }

      - name: Check FUnit report
        run: |
          set -euo pipefail
          report="$REPORTS_DIR/funit-report-planetslib.json"
          if [ ! -f "$report" ]; then
            echo "::error::Missing $report"
            ls -la "$REPORTS_DIR" || true
            exit 1
          fi
          python3 - "$report" <<'PY'
          import json, sys

          report = json.load(open(sys.argv[1]))
          failures = report.get("failures", 0)
          errors = report.get("errors", 0)
          print(f"tests={report.get('tests')} failures={failures} errors={errors} skipped={report.get('skipped')}")

          bad = False
          for tc in report.get("testcases", []):
              if "failure" in tc:
                  bad = True
                  print("FAIL:", tc.get("name"), "->", tc["failure"].get("message"))
              if "error" in tc:
                  bad = True
                  print("ERROR:", tc.get("name"), "->", tc["error"].get("message"))

          sys.exit(1 if (bad or failures or errors) else 0)
          PY

      - name: Upload FUnit log and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funit-${{ matrix.mods.label }}-entity-replacements-${{ matrix.entity_replacements }}
          path: |
            funit.log
            factorio/script-output/
          if-no-files-found: ignore
