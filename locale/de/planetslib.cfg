[mod-setting-description]
PlanetsLib-warn-on-hidden-prerequisites=Warnt den Spieler, wenn ein Spiel mit versteckten Voraussetzungen geladen wird.
PlanetsLib-update-vanilla-recipe-productivity-techs=Fügt alle relevanten Baupläne zu Standard-Produktivitäts-Technologien hinzu, wenn sie nicht bereits hinzugefügt sind. Sollte normalerweise aktiviert bleiben, könnte aber zu Kompatibilitätsproblemen mit älteren Mods führen.
PlanetsLib-unlink-hidden-prerequisites=Falls eine versteckte Technologie Voraussetzung für eine nachfolgende ist, wird sie als deren Voraussetzung entfernt, damit der Nachfolger nicht blockiert ist.
PlanetsLib-enhanced-tooltips=Fügt neue Tooltips zu Prototypen hinzu, die dem Spieler zuvor versteckte Informationen zugänglich machen.
PlanetsLib-enable-entity-replacements=Aktiviert Objekt-Ersetzungen, die unabhängig von anderen Grundeinstellungen sind. Zur Unterstützung bei der Deinstallation als Fallback, falls ModderInnen ihre Objekt-Ersetzungen nicht von einer Einstellung abhängig gemacht haben.
PlanetsLib-disable-all-entity-replacements=Erzwingt die Deaktivierung aller Objekt-Ersetzungen für alle Mods. Sollte nicht notwendig sein, es sei denn, eine Mod ist stark fehlerhaft konfiguriert.
PlanetsLib-enable-runtime-rocket-silo-replacements=Falls Planeten einen Multiplikator für Hubgewicht oder Raketenbauteile definieren, werden Raketensilo-Ersetzungen im laufenden Betrieb durchgeführt. Deaktiviere diese Einstellung, um dieses Verhalten sicher zu unterbinden und mache Ersetzungen in Speicherständen rückgängig, falls eine Mod diese Funktion auf unsichere Weise genutzt hat.
